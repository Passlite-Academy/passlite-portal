<!DOCTYPE html>
<html>
<head>
    <title>Passlite Insights Academy - Portal Login</title>
</head>
<body style="font-family: Arial; padding: 40px; text-align: center; background: #f4f6f9;">
    <div style="max-width: 450px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
        <h2 style="color: navy;">Passlite School Portal</h2>
        <p style="color: #666;">Select your category to proceed to termly payment and report generation:</p>
        
        <form action="/initialize_payment" method="POST">
            <label style="font-weight: bold; display: block; text-align: left; margin-top: 15px;">School ID / Name:</label>
            <input type="text" name="school_id" placeholder="e.g. bright_future" style="width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box;" required>

            <label style="font-weight: bold; display: block; text-align: left; margin-top: 15px;">Select Section & Termly Fee:</label>
            <select name="plan_type" style="width: 100%; padding: 10px; margin-top: 5px;" required>
                <option value="junior">Junior Secondary School (JSS 1-3) - ₦20,000 / term</option>
                <option value="senior">Senior Secondary School (SSS 1-3) - ₦25,000 / term</option>
            </select>

            <button type="submit" style="width: 100%; margin-top: 25px; padding: 12px; background: navy; color: white; border: none; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 4px;">Proceed to Payment</button>
        </form>
    </div>
</body>
</html>
